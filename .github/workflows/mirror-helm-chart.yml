name: Generic Helm Chart Mirror

on:
  workflow_call:
    inputs:
      chart_name:
        required: true
        type: string
        description: "Helm chart name (e.g. redis)"
      chart_version:
        required: true
        type: string
        description: "Helm chart version to mirror (e.g. 22.0.7)"
      chart_repo_url:
        required: true
        type: string
        description: "Source Helm repository URL (OCI or index-based HTTP/S)"
      target_package:
        required: true
        type: string
        description: "Target package path without registry (e.g. owner/charts)"

env:
  REGISTRY: ghcr.io

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up ORAS
        uses: oras-project/setup-oras@ccb71166b124a8452d1b72c4476398a909ed4d63 # main with ORAS v1.3.4 support
        with:
          version: 1.3.4

      - name: Log in to target OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: Select mirror strategy
        id: strategy
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_REPO_URL: ${{ inputs.chart_repo_url }}
          CHART_VERSION: ${{ inputs.chart_version }}
          TARGET_PACKAGE: ${{ inputs.target_package }}
        run: |
          if [[ "$CHART_REPO_URL" == oci://* ]]; then
            echo "oci_source=true" >> "$GITHUB_OUTPUT"
            echo "skip_push=false" >> "$GITHUB_OUTPUT"
          elif helm pull "oci://${REGISTRY}/${TARGET_PACKAGE}/${CHART_NAME}" --version "$CHART_VERSION" 2>/dev/null; then
            echo "Chart ${CHART_NAME}:${CHART_VERSION} already exists in target. Skipping push."
            echo "oci_source=false" >> "$GITHUB_OUTPUT"
            echo "skip_push=true" >> "$GITHUB_OUTPUT"
            rm -f "${CHART_NAME}-${CHART_VERSION}.tgz"
          else
            echo "Chart version not found in target. Proceeding with mirror."
            echo "oci_source=false" >> "$GITHUB_OUTPUT"
            echo "skip_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy OCI chart and referrers
        if: steps.strategy.outputs.oci_source == 'true'
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_REPO_URL: ${{ inputs.chart_repo_url }}
          CHART_VERSION: ${{ inputs.chart_version }}
          TARGET_PACKAGE: ${{ inputs.target_package }}
        run: |
          SOURCE_PATH="${CHART_REPO_URL#oci://}"
          SOURCE_REF="${SOURCE_PATH%/}/${CHART_NAME}:${CHART_VERSION}"
          TARGET_REF="${REGISTRY}/${TARGET_PACKAGE}/${CHART_NAME}:${CHART_VERSION}"
          MAX_RETRIES=5
          BASE_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES to copy chart and OCI referrers..."
            if oras cp --recursive "$SOURCE_REF" "$TARGET_REF"; then
              echo "Successfully copied chart and OCI referrers"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                DELAY=$((BASE_DELAY * (2 ** (i - 1))))
                echo "Copy failed (possibly rate limited), retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

          SOURCE_DIGEST=$(oras resolve "$SOURCE_REF")
          TARGET_DIGEST=$(oras resolve "$TARGET_REF")
          if [ "$SOURCE_DIGEST" != "$TARGET_DIGEST" ]; then
            echo "Mirrored digest $TARGET_DIGEST does not match source digest $SOURCE_DIGEST"
            exit 1
          fi

      - name: Pull chart from HTTP source
        if: steps.strategy.outputs.oci_source == 'false' && steps.strategy.outputs.skip_push == 'false'
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_REPO_URL: ${{ inputs.chart_repo_url }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          MAX_RETRIES=5
          BASE_DELAY=15
          helm repo add upstream "$CHART_REPO_URL" --force-update

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES to pull chart..."
            if helm pull "upstream/${CHART_NAME}" --version "$CHART_VERSION"; then
              echo "Successfully pulled chart"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                DELAY=$((BASE_DELAY * (2 ** (i - 1))))
                echo "Pull failed (possibly rate limited), retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Failed to pull after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Push chart to target registry
        if: steps.strategy.outputs.oci_source == 'false' && steps.strategy.outputs.skip_push == 'false'
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_VERSION: ${{ inputs.chart_version }}
          TARGET_PACKAGE: ${{ inputs.target_package }}
        run: |
          MAX_RETRIES=5
          BASE_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES to push chart..."
            if helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${TARGET_PACKAGE}"; then
              echo "Successfully pushed chart"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                DELAY=$((BASE_DELAY * (2 ** (i - 1))))
                echo "Push failed (possibly rate limited), retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Verify mirrored chart
        if: steps.strategy.outputs.oci_source == 'false' && steps.strategy.outputs.skip_push == 'false'
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          CHART_VERSION: ${{ inputs.chart_version }}
          TARGET_PACKAGE: ${{ inputs.target_package }}
        run: |
          helm pull "oci://${REGISTRY}/${TARGET_PACKAGE}/${CHART_NAME}" --version "$CHART_VERSION"
          echo "Verified: chart ${CHART_NAME}:${CHART_VERSION} is available in target registry"
