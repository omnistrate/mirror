name: Generic Docker Image Mirror

on:
  workflow_call:
    inputs:
      source_image:
        required: true
        type: string
        description: "Source Docker image to mirror (e.g. docker.io/library/busybox)"
      target_package:
        required: true
        type: string
        description: "Target package name without registry (e.g. owner/image)"
      tag:
        required: true
        type: string
        description: "Version tag of the source image to mirror"

env:
  REGISTRY: ghcr.io

jobs:
  mirror:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Set up regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: Copy image and OCI referrers
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_PACKAGE: ${{ inputs.target_package }}
          VERSION: ${{ inputs.tag }}
        run: |
          SOURCE_TAG_REF="${SOURCE_IMAGE}:${VERSION}"
          TARGET_REF="${REGISTRY}/${TARGET_PACKAGE}:${VERSION}"
          MAX_RETRIES=5
          BASE_DELAY=15

          if TARGET_DIGEST=$(regctl image digest "$TARGET_REF" 2>/dev/null); then
            # Preserve the digest already published under the target tag. The
            # upstream tag may have moved since it was first mirrored.
            SOURCE_REF="${SOURCE_IMAGE}@${TARGET_DIGEST}"
            EXPECTED_DIGEST="$TARGET_DIGEST"
            echo "Target already exists at ${TARGET_DIGEST}; backfilling referrers from the immutable source digest."
            if ! regctl image digest "$SOURCE_REF" >/dev/null 2>&1; then
              echo "::warning::Source no longer exposes ${SOURCE_REF}; keeping ${TARGET_REF} unchanged and skipping referrer backfill."
              exit 0
            fi
          else
            SOURCE_REF="$SOURCE_TAG_REF"
            EXPECTED_DIGEST=$(regctl image digest "$SOURCE_REF")
            echo "Target does not exist; mirroring source digest ${EXPECTED_DIGEST}."
          fi

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if regctl image copy --referrers --force-recursive "$SOURCE_REF" "$TARGET_REF"; then
              echo "Successfully copied image and OCI referrers"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                DELAY=$((BASE_DELAY * (2 ** (i - 1))))
                echo "Copy failed (possibly rate limited), retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

          MIRRORED_DIGEST=$(regctl image digest "$TARGET_REF")
          if [ "$MIRRORED_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "Mirrored digest $MIRRORED_DIGEST does not match expected digest $EXPECTED_DIGEST"
            exit 1
          fi
