name: Generic Docker Image Mirror

on:
  workflow_call:
    inputs:
      source_image:
        required: true
        type: string
        description: "Source Docker image to mirror (e.g. docker.io/library/busybox)"
      target_package:
        required: true
        type: string
        description: "Target package name without registry (e.g. owner/image)"
      tag:
        required: true
        type: string
        description: "Version tag of the source image to mirror"

env:
  REGISTRY: ghcr.io

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Set up regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: Copy image and OCI referrers
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_PACKAGE: ${{ inputs.target_package }}
          VERSION: ${{ inputs.tag }}
        run: |
          SOURCE_REF="${SOURCE_IMAGE}:${VERSION}"
          TARGET_REF="${REGISTRY}/${TARGET_PACKAGE}:${VERSION}"
          MAX_RETRIES=5
          BASE_DELAY=15

          # Do not skip existing tags: recursive copy backfills referrers that
          # may have been published after the image itself was mirrored.
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES..."
            if regctl image copy --referrers --digest-tags --force-recursive "$SOURCE_REF" "$TARGET_REF"; then
              echo "Successfully copied image, OCI referrers, and digest tags"
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                DELAY=$((BASE_DELAY * (2 ** (i - 1))))
                echo "Copy failed (possibly rate limited), retrying in ${DELAY}s..."
                sleep $DELAY
              else
                echo "Failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

          SOURCE_DIGEST=$(regctl image digest "$SOURCE_REF")
          TARGET_DIGEST=$(regctl image digest "$TARGET_REF")
          if [ "$SOURCE_DIGEST" != "$TARGET_DIGEST" ]; then
            echo "Mirrored digest $TARGET_DIGEST does not match source digest $SOURCE_DIGEST"
            exit 1
          fi
